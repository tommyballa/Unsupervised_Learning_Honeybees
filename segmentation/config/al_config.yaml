# Configurazione unica di active learning + semi-supervised (letta da bee_al/config.py).
# I percorsi relativi sono risolti rispetto alla root del repo.

seed: 42

paths:
  # Cartelle delle api, {nome: cartella}. L'image_id di ogni ape è "<nome>__<file>",
  # perché i nomi dei file (bee_00000_...) si ripetono da una cartella all'altra.
  dataset_dirs:
    train_b34: /home/tommaso_ballarin/bees_datasets/DatasetApi_Ceschi/processed/train_single_bee_batch3+4/cleaned_bees
    test_b34_novarroa: /home/tommaso_ballarin/bees_datasets/DatasetApi_Ceschi/processed/test_single_bee_batch3+4_novarroa/cleaned_bees
  # Stato separato da quello del dataset precedente (train_single_bee_merged), che resta in
  # active_learning_tool/results, data/embeddings e models.
  # Etichette e modelli stanno su /mnt/disk1: il disco di sistema è quasi pieno.
  results_dir: /mnt/disk1/tommaso_ballarin/bee_al/results_batch3+4   # al_labels.csv, validation_set.json, al_rounds.jsonl
  embeddings_dir: data/embeddings_batch3+4             # embedding dell'extractor congelato (v000)
  models_dir: /mnt/disk1/tommaso_ballarin/bee_al/models_batch3+4     # vNNN/ prodotti dai re-train

labels:
  # Le classi NON sono definite qui: nascono dalle etichette inserite nell'hub.
  classes: []            # solo suggerimenti, mostrati come quick label
  label_aliases: {}      # es. {"Bad Seg": "Bad_Seg"}: applicati in lettura, lo storico non cambia
  # Classi di scarto: crop che non si possono giudicare. Restano nel kNN (così il modello impara a
  # riconoscerle) ma sono escluse dai cluster finali e dal denominatore delle prevalenze; nello
  # snapshot hanno stato "rejected" e nell'audit uno strato per classe, per stimare quante api
  # valide vengono scartate per errore.
  # Esempio: ["Blurry", "Bad Seg", "Multiple Bees", "No Bee"]
  # Regola per gli annotatori: se il difetto impedisce di giudicare il fenotipo è scarto;
  # se il fenotipo si riconosce comunque si etichetta il fenotipo.
  reject_classes: []

extractor:
  model: dinov2_vits14   # oppure dinov2_vitb14
  image_size: 224
  batch_size: 128
  num_workers: 4
  shard_size: 2048
  device: auto           # auto | cuda | cuda:0 | cpu

knn:
  k: 10
  temperature: 0.07      # peso del vicino = exp(similarità / temperature)
  backend: auto          # auto | faiss | sklearn | numpy
  # Le api più lontane da ogni esempio etichettato (questa frazione delle non etichettate)
  # non vengono forzate in una classe: formano il gruppo "non assegnate". 0 = disattivato.
  unassigned_fraction: 0.05

propagation:
  enabled: true
  n_neighbors: 15
  alpha: 0.8
  max_iter: 30
  tol: 1.0e-4

query:
  batch_size: 30
  cold_start_threshold: 50
  uncertainty: margin              # margin | entropy | least_confidence
  uncertainty_source: propagation  # knn | propagation
  candidate_multiplier: 10         # top-M più incerte, M = candidate_multiplier × batch
  random_fraction: 0.1
  novelty_fraction: 0.2            # quota del batch per le api più lontane da ogni etichetta (regime normale)

validation:
  size: 100
  seed: 123

hub:
  show_suggestion: false      # suggerimento kNN nascosto per evitare l'effetto ancora
  assignment_timeout_s: 900   # dopo quanto un'immagine assegnata e non etichettata torna libera

retrain:
  # Il pulsante "Start re-train" in /al-status funziona sempre.
  # enabled: true fa partire i job anche da soli, secondo la policy qui sotto.
  enabled: false
  policy: label_count     # label_count | plateau | either
  initial_labels: 50      # primo job dopo N nuove etichette...
  growth_factor: 2.0      # ...poi N cresce: 50, 100, 200, 400, ...
  plateau_rounds: 3       # K round senza miglioramento della metrica di validazione
  metric: macro_f1        # macro_f1 | accuracy
  min_delta: 0.0

  # --- trainer contrastive (fine-tuning dell'extractor) ---
  trainer: contrastive    # contrastive | stub
  python: venv/bin/python # interprete con torch: il training gira in un processo separato dall'hub
  min_labels: 20          # sotto questa soglia (o con meno di 2 classi) il re-train non parte
  require_improvement: true     # se la metrica di validazione peggiora, la versione nuova viene scartata
  pseudo_label_threshold: 0.95  # confidenza minima per usare la predizione di un'ape come pseudo-label (> 1 = nessuna)
  unfreeze_blocks: 2      # ultimi blocchi del ViT da addestrare (0 = tutti)
  steps: 300
  batch_size: 96          # api per step; ognuna entra con 2 viste aumentate
  labeled_fraction: 0.5   # parte del batch presa da etichettate + pseudo-label; il resto è non etichettato
  lr_backbone: 1.0e-5
  lr_head: 1.0e-3
  temperature: 0.1
  projection_dim: 128
  num_workers: 8
  device: auto

stopping:
  # Criteri di stop mostrati in /al-status. Contano solo i round in cui sono arrivate etichette nuove.
  window: 3               # numero di round consecutivi su cui valutare i tre criteri
  max_pred_change: 0.01   # predizioni stabili: meno dell'1% delle api cambia classe da un round all'altro
  f1_min_delta: 0.01      # plateau: la macro-F1 di validazione non migliora più di così

frames:
  # Da quale frame viene ogni ape: si ricava dal manifest dell'estrazione di ogni cartella.
  # Vuoto = <cartella pulita>/../raw_bees/_extraction_manifest.json; altrimenti {nome cartella: percorso}.
  manifests: {}
  # Regex con i gruppi nominati (?P<session>...) e/o (?P<colony>...) applicata al nome del frame,
  # es. "(?P<colony>hive\\d+)_(?P<session>\\d{8})". Vuota = sessione = nome della cartella, alveare assente.
  frame_pattern: ""
  # Sessione = cartella che contiene il frame originale. I frame si chiamano DSC_xxxx.JPG e dal nome
  # non si ricava nulla: batch_3 è del 12/09/2026, batch_4 del 26/09/2026, stesso alveare, con flash e zoom diversi.
  session_dirs:
    batch_3: /home/tommaso_ballarin/bees_datasets/DatasetApi_Ceschi/batch_3
    batch_4: /home/tommaso_ballarin/bees_datasets/DatasetApi_Ceschi/batch_4
  colony: ""             # nome dell'alveare per tutti i frame (un solo alveare fotografato); vuoto = non indicato

audit:
  # Campione di controllo di uno snapshot: stratificato per classe predetta, etichettato alla cieca.
  # Le etichette di audit non entrano mai nel kNN: servono solo a correggere le stime.
  per_stratum: 40           # api estratte da ogni strato (tutte, se lo strato ne ha meno)
  large_stratum: 250        # api estratte dagli strati con almeno large_threshold api
  large_threshold: 5000
  confidence_bins: [0.9]    # ogni classe predetta è divisa in fasce di confidenza: <0.9 e >=0.9
  double_fraction: 0.1      # quota del campione etichettata da due annotatori diversi (accordo, kappa)
  anomaly_split_class: ""   # es. "Healthy": i suoi strati si dividono anche per anomaly score, se viene fornito
  anomaly_quantile: 0.9
  seed: 7
  # Vuoto, oppure session | colony | dataset: divide ogni strato anche per quel gruppo, così gli errori del
  # modello sono misurati gruppo per gruppo. Consigliato "session" quando le sessioni hanno luce o zoom
  # diversi; il campione da etichettare cresce (circa il doppio con due sessioni).
  stratify_by: ""

colony:
  # Indicatori di colonia, calcolati sulle stime corrette dall'audit (scripts/audit_report.py).
  group_by: session           # frame | session | colony | dataset
  demographic_classes: []     # I1: classi del profilo demografico, es. ["Nurse", "Forager", "Drone"]
  disease_classes: []         # I2: classi che sono segni di malattia, es. ["Varroa", "Deformed Wing"]
  min_detected: 3             # I2: api confermate da un umano perché un segno sia "detected"
  reference_groups: []        # I3: gruppi sani di riferimento; vuoto = media di tutti i gruppi
  time_order:                 # I5: {alveare: [sessione1, sessione2, ...]}; "*" = tutti gli alveari insieme
    "*": [batch_3, batch_4]
  anomaly_threshold: 0.0      # quota di api con anomaly score sopra soglia (0 = spento)
  n_boot: 1000
  seed: 11
  light_rules: [disease_detected, profile_divergent]   # anche: unexplained_high
  red_min_rules: 2            # regole scattate insieme per il rosso (una sola = giallo)
  max_unexplained: 0.0        # soglia di I4 per la regola unexplained_high (0 = spenta)

simulation:
  seeds: [0, 1, 2, 3, 4]
  max_labels: 400
  threshold_metric: macro_f1
  threshold: 0.8
  synthetic_n: 3000
  synthetic_dim: 64
  synthetic_classes: 6
  synthetic_imbalance: 0.6   # ogni classe ha il 60% degli esempi della precedente
  synthetic_noise: 2.0
