# Configurazione unica di active learning + semi-supervised (letta da bee_al/config.py).
# I percorsi relativi sono risolti rispetto alla root del repo.

seed: 42

paths:
  # Cartelle delle api, {nome: cartella}. L'image_id di ogni ape è "<nome>__<file>",
  # perché i nomi dei file (bee_00000_...) si ripetono da una cartella all'altra.
  dataset_dirs:
    train_b34: /home/tommaso_ballarin/bees_datasets/DatasetApi_Ceschi/processed/train_single_bee_batch3+4/cleaned_bees
    test_b34_novarroa: /home/tommaso_ballarin/bees_datasets/DatasetApi_Ceschi/processed/test_single_bee_batch3+4_novarroa/cleaned_bees
  # Stato separato da quello del dataset precedente (train_single_bee_merged), che resta in
  # active_learning_tool/results, data/embeddings e models.
  # Etichette e modelli stanno su /mnt/disk1: il disco di sistema è quasi pieno.
  results_dir: /mnt/disk1/tommaso_ballarin/bee_al/results_batch3+4   # al_labels.csv, validation_set.json, al_rounds.jsonl
  embeddings_dir: data/embeddings_batch3+4             # embedding dell'extractor congelato (v000)
  models_dir: /mnt/disk1/tommaso_ballarin/bee_al/models_batch3+4     # vNNN/ prodotti dai re-train

labels:
  # Le classi NON sono definite qui: nascono dalle etichette inserite nell'hub.
  classes: []            # solo suggerimenti, mostrati come quick label
  label_aliases: {}      # es. {"Bad Seg": "Bad_Seg"}: applicati in lettura, lo storico non cambia
  reject_classes: []     # es. ["Bad_Seg", "Blurry"]: restano nel kNN, escluse dai cluster finali

extractor:
  model: dinov2_vits14   # oppure dinov2_vitb14
  image_size: 224
  batch_size: 128
  num_workers: 4
  shard_size: 2048
  device: auto           # auto | cuda | cuda:0 | cpu

knn:
  k: 10
  temperature: 0.07      # peso del vicino = exp(similarità / temperature)
  backend: auto          # auto | faiss | sklearn | numpy
  # Le api più lontane da ogni esempio etichettato (questa frazione delle non etichettate)
  # non vengono forzate in una classe: formano il gruppo "non assegnate". 0 = disattivato.
  unassigned_fraction: 0.05

propagation:
  enabled: true
  n_neighbors: 15
  alpha: 0.8
  max_iter: 30
  tol: 1.0e-4

query:
  batch_size: 30
  cold_start_threshold: 50
  uncertainty: margin              # margin | entropy | least_confidence
  uncertainty_source: propagation  # knn | propagation
  candidate_multiplier: 10         # top-M più incerte, M = candidate_multiplier × batch
  random_fraction: 0.1
  novelty_fraction: 0.2            # quota del batch per le api più lontane da ogni etichetta (regime normale)

validation:
  size: 100
  seed: 123

hub:
  show_suggestion: false      # suggerimento kNN nascosto per evitare l'effetto ancora
  assignment_timeout_s: 900   # dopo quanto un'immagine assegnata e non etichettata torna libera

retrain:
  # Il pulsante "Start re-train" in /al-status funziona sempre.
  # enabled: true fa partire i job anche da soli, secondo la policy qui sotto.
  enabled: false
  policy: label_count     # label_count | plateau | either
  initial_labels: 50      # primo job dopo N nuove etichette...
  growth_factor: 2.0      # ...poi N cresce: 50, 100, 200, 400, ...
  plateau_rounds: 3       # K round senza miglioramento della metrica di validazione
  metric: macro_f1        # macro_f1 | accuracy
  min_delta: 0.0

  # --- trainer contrastive (fine-tuning dell'extractor) ---
  trainer: contrastive    # contrastive | stub
  python: venv/bin/python # interprete con torch: il training gira in un processo separato dall'hub
  min_labels: 20          # sotto questa soglia (o con meno di 2 classi) il re-train non parte
  require_improvement: true     # se la metrica di validazione peggiora, la versione nuova viene scartata
  pseudo_label_threshold: 0.95  # confidenza minima per usare la predizione di un'ape come pseudo-label (> 1 = nessuna)
  unfreeze_blocks: 2      # ultimi blocchi del ViT da addestrare (0 = tutti)
  steps: 300
  batch_size: 96          # api per step; ognuna entra con 2 viste aumentate
  labeled_fraction: 0.5   # parte del batch presa da etichettate + pseudo-label; il resto è non etichettato
  lr_backbone: 1.0e-5
  lr_head: 1.0e-3
  temperature: 0.1
  projection_dim: 128
  num_workers: 8
  device: auto

simulation:
  seeds: [0, 1, 2, 3, 4]
  max_labels: 400
  threshold_metric: macro_f1
  threshold: 0.8
  synthetic_n: 3000
  synthetic_dim: 64
  synthetic_classes: 6
  synthetic_imbalance: 0.6   # ogni classe ha il 60% degli esempi della precedente
  synthetic_noise: 2.0
