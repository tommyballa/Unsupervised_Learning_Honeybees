# Phase 'fase2_sam3': 138788 bees with class ['Ok'] in the snapshot 'fase1_finale_okvsscarta'
# of al_config.yaml. Written by scripts/new_stage.py; labels and models are separate.
# Added 34645 bees from 'b7' (batch 7) filtered with model v003 of phase 1 (scripts/add_dataset_to_stage.py).

seed: 42
paths:
  dataset_dir: ${BEE_AL_WORKDIR}/images
  dataset_dirs:
    sam3_b3456: ${BEES_DATA_ROOT}/processed/single_bee3+4+5+6_SAM3/cleaned_bees
    b7: ${BEES_DATA_ROOT}/processed/single_bee7_SAM3/cleaned_bees
  results_dir: ${BEE_AL_WORKDIR}/results_fase2_sam3
  embeddings_dir: ${BEE_AL_WORKDIR}/embeddings_sam3_b3456
  models_dir: ${BEE_AL_WORKDIR}/models_fase2_sam3
  subset_file: ${BEE_AL_WORKDIR}/results_fase2_sam3/subset.json
labels:
  # Demographic profile: Giovane (young), Adulte (adult), Fuco (drone). Malata: sick bees in general.
  # Non Classificabile: cannot be judged because of segmentation or pose (reject class, left out of the shares).
  classes: [Giovane, Adulte, Fuco, Malata, Non Classificabile]
  label_aliases: {Non Classificabille: Non Classificabile}
  reject_classes: [Non Classificabile]
extractor:
  model: dinov2_vits14
  image_size: 224
  batch_size: 128
  num_workers: 4
  shard_size: 2048
  device: auto
knn:
  k: 10
  temperature: 0.07
  backend: auto
  unassigned_fraction: 0.05
propagation:
  enabled: true
  n_neighbors: 15
  alpha: 0.8
  max_iter: 30
  tol: 0.0001
query:
  batch_size: 30
  cold_start_threshold: 50
  uncertainty: margin
  uncertainty_source: propagation
  candidate_multiplier: 10
  random_fraction: 0.1
  novelty_fraction: 0.2
validation:
  size: 100
  seed: 123
  # Batch 7 held out: predicted and visible in the clusters, never proposed or used for training.
  holdout_datasets: [b7]
hub:
  show_suggestion: false
  assignment_timeout_s: 900.0
retrain:
  enabled: false
  policy: label_count
  initial_labels: 50
  growth_factor: 2.0
  plateau_rounds: 3
  metric: macro_f1
  min_delta: 0.0
  trainer: contrastive
  python: venv/bin/python
  min_labels: 20
  require_improvement: true
  pseudo_label_threshold: 0.95
  unfreeze_blocks: 2
  steps: 300
  batch_size: 96
  labeled_fraction: 0.5
  lr_backbone: 1.0e-05
  lr_head: 0.001
  temperature: 0.1
  projection_dim: 128
  num_workers: 8
  device: auto
stopping:
  window: 3
  max_pred_change: 0.01
  f1_min_delta: 0.01
frames:
  manifests: {}
  frame_pattern: ''
  session_dirs:
    batch_3: ${BEES_DATA_ROOT}/batch_3
    batch_4: ${BEES_DATA_ROOT}/batch_4
    batch_5: ${BEES_DATA_ROOT}/batch_5
    batch_6: ${BEES_DATA_ROOT}/batch_6
    batch_7: ${BEES_DATA_ROOT}/batch_7
  colony: ''
audit:
  per_stratum: 40
  large_stratum: 250
  large_threshold: 5000
  confidence_bins:
  - 0.9
  double_fraction: 0.1
  anomaly_split_class: ''
  anomaly_quantile: 0.9
  seed: 7
colony:
  group_by: session
  demographic_classes: [Giovane, Adulte, Fuco]
  disease_classes: [Malata]
  min_detected: 3
  reference_groups: []
  time_order:
    '*':
    - batch_3
    - batch_4
    - batch_5
    - batch_6
    - batch_7
  anomaly_threshold: 0.0
  n_boot: 1000
  seed: 11
  light_rules:
  - disease_detected
  - profile_divergent
  red_min_rules: 2
  max_unexplained: 0.0
stage:
  name: fase2_sam3
  title: Phase 2 - only the bees kept as Ok in phase 1
  description: Only the bees of ['Ok'] from 'fase1_finale_okvsscarta'.
export:
  clusters_dir: ${BEES_DATA_ROOT}/processed/single_bee3+4+5+6_SAM3_clusters
  mode: copy
review:
  enabled: true
  k: 0
  min_disagreement: 0.8
  min_class_size: 5
  show_neighbors: 6
simulation:
  seeds:
  - 0
  - 1
  - 2
  - 3
  - 4
  max_labels: 400
  threshold_metric: macro_f1
  threshold: 0.8
  synthetic_n: 3000
  synthetic_dim: 64
  synthetic_classes: 6
  synthetic_imbalance: 0.6
  synthetic_noise: 2.0
